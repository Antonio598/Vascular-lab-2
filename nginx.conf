server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # El HTTPS lo termina el proxy de Easypanel: las redirecciones deben ser relativas
    # para no mandar al visitante a http://
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Archivos con hash generados por Next.js: caché larga
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # /estudios y /estudios/ sirven lo mismo, sin redirección (útil para los QR)
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
